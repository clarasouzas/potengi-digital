{% extends "base.html" %}

{% block title %}{{ noticia.titulo }} — LinkIF{% endblock %}

{% block content %}
<section class="py-5">
  <article class="container" style="max-width: 900px;">
    {% if noticia.imagem %}
    <img src="{{ noticia.imagem.url }}" class="img-fluid rounded mb-4" alt="{{ noticia.titulo }}">
    {% endif %}
    <p class="text-muted">{{ noticia.data_publicacao|date:"d/m/Y" }}</p>
    <h1 class="fw-bold">{{ noticia.titulo }}</h1>
    <p class="lead">{{ noticia.resumo }}</p>
    <div>{{ noticia.conteudo|linebreaks }}</div>
    <a href="{% url 'linkif:noticias_lista' %}" class="btn-dupla">Voltar às notícias</a>
  </article>
</section>
{% endblock %}
