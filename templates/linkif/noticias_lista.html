{% extends "base.html" %}
{% block content %}
<section class="py-5">
  <div class="container">
    <h1 class="fw-bold mb-4 text-center">Todas as Notícias</h1>
    <div class="row g-4">
      {% for n in noticias %}
      <div class="col-md-4">
        <div class="card h-100 shadow-sm">
          {% if n.imagem %}
            <img src="{{ n.imagem.url }}" class="card-img-top" style="height:200px;object-fit:cover;" alt="">
          {% endif %}
          <div class="card-body d-flex flex-column">
            <h5 class="fw-bold">{{ n.titulo }}</h5>
            <p class="text-muted small">{{ n.data_publicacao|date:"d/m/Y" }}</p>
            <p>{{ n.resumo }}</p>
            <a href="{% url 'linkif:noticia_detalhe' n.id %}"
               class="btn-dupla text-center mt-auto">Detalhar notícia</a>
          </div>
        </div>
      </div>
      {% empty %}
        <p class="text-center text-secondary">Nenhuma notícia publicada.</p>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}
