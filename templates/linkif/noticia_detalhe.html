{% extends "base.html" %}
{% block content %}
<section class="py-5">
  <div class="container">
    <a href="{% url 'linkif:noticias_lista' %}" class="btn-dupla btn-link mb-3">← Voltar</a>
    <h1 class="fw-bold">{{ noticia.titulo }}</h1>
    <p class="text-muted">
      Publicado em {{ noticia.data_publicacao|date:"d/m/Y H:i" }}
      {% if noticia.autor %} • por {{ noticia.autor.username }}{% endif %}
    </p>
    {% if noticia.imagem %}
      <img src="{{ noticia.imagem.url }}" class="img-fluid rounded my-4" alt="">
    {% endif %}
    <div class="lead">{{ noticia.conteudo|linebreaks }}</div>
  </div>
</section>
{% endblock %}
